[project]
name = "brahma"
version = "0.1.0"
description = "Bootstrap Agents: Recursive Self-Organization for Long-Horizon Autonomous Task Execution"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.115.0",
    "httpx>=0.28.0",
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
    "uvicorn[standard]>=0.34.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
]

[project.scripts]
brahma = "brahma.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.0.3",
    "pytest-asyncio>=1.3.0",
    "ruff>=0.15.14",
    "ty>=0.0.39",
]

# ═══════════════════════════════════════════════════════════════════════════
# Ruff — annotation presence + docstring discipline
# ═══════════════════════════════════════════════════════════════════════════

[tool.ruff]
target-version = "py314"
line-length = 100

[tool.ruff.lint]
select = [
    "ANN",   # flake8-annotations: require type annotations on all functions
    "D",     # pydocstyle: require docstrings on public modules/classes/functions
    "FBT",   # flake8-boolean-trap: no bare bool params
    "B",     # flake8-bugbear: common footguns (mutable defaults, bare except, etc.)
    "E",     # pycodestyle errors
    "F",     # pyflakes (unused imports, undefined names, etc.)
    "I",     # isort: sorted imports
    "UP",    # pyupgrade: modernize syntax
    "SIM",   # flake8-simplify: simplify conditionals
    "T20",   # flake8-print: no print() left behind
]
ignore = [
    "D203",  # 1 blank line before class (conflicts with D211)
    "D212",  # Multi-line summary first line (conflicts with D213)
    "D100",  # Missing docstring in public module (noisy for small modules)
    "D104",  # Missing docstring in public package (__init__.py)
]

[tool.ruff.lint.flake8-annotations]
mypy-init-return = true        # __init__ return type is always None
allow-star-arg-any = false
suppress-dummy-args = false

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
docstring-code-format = true

# ═══════════════════════════════════════════════════════════════════════════
# ty — type correctness (same config file, same team, same ecosystem)
# ═══════════════════════════════════════════════════════════════════════════

[tool.ty.environment]
python-version = "3.14"
